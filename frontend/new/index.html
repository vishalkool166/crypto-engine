<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Signal Engine" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Automated crypto futures signal engine" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <title>Signal Engine v5</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #000000;
        z-index: 9999;
      }

      .initial-loader-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255,255,255,0.08);
        border-top-color: #00C7BE;
        border-radius: 50%;
        animation: spin 0.55s linear infinite;
      }

      .initial-loader-text {
        font-size: 12px;
        color: rgba(235,235,245,0.30);
        letter-spacing: 0.05em;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-LryJ01vt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DyVinJop.css">
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" id="initial-loader">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#0a0a0f"/>
          <polygon
            points="18,3 8,18 15,18 14,29 24,14 17,14"
            fill="#00C7BE"
            stroke="#00C7BE"
            stroke-width="0.5"
            stroke-linejoin="round"
          />
        </svg>
        <div class="initial-loader-spinner"></div>
        <div class="initial-loader-text">Signal Engine v5</div>
      </div>
    </div>


    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader')
          if (loader) {
            loader.style.opacity = '0'
            loader.style.transition = 'opacity 0.3s ease'
            setTimeout(() => loader.remove(), 300)
          }
        }, 200)
      })
    </script>
  </body>
</html>
