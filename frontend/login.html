<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Signal Engine v5 — Sign In</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/forms.css">
    <link rel="stylesheet" href="/css/components/feedback.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            padding-bottom: calc(20px + var(--safe-bottom));
        }

        .login-root {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            text-align: center;
        }

        .login-brand-icon {
            width: 56px;
            height: 56px;
        }

        .login-brand-name {
            font-size: var(--text-2xl);
            font-weight: var(--weight-heavy);
            color: var(--text-1);
            letter-spacing: var(--tracking-snug);
        }

        .login-brand-sub {
            font-size: var(--text-xs);
            color: var(--text-4);
            font-family: var(--font-mono);
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
            margin-top: -4px;
        }

        .login-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--r-2xl);
            padding: 32px;
            box-shadow: var(--shadow-lg);
        }

        .login-card-title {
            font-size: var(--text-xl);
            font-weight: var(--weight-bold);
            color: var(--text-1);
            letter-spacing: var(--tracking-snug);
            margin-bottom: 4px;
        }

        .login-card-sub {
            font-size: var(--text-sm);
            color: var(--text-3);
            margin-bottom: 28px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-totp-row {
            display: flex;
            gap: 8px;
        }

        .login-totp-row .input {
            flex: 1;
            font-family: var(--font-mono);
            font-size: var(--text-xl);
            letter-spacing: 8px;
            text-align: center;
        }

        .login-submit {
            margin-top: 4px;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: var(--text-xs);
            color: var(--text-4);
        }

        .login-footer a {
            color: var(--brand);
            text-decoration: none;
        }

        .login-footer a:hover {
            opacity: 0.8;
        }

        .attempt-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
        }

        .attempt-pip {
            width: 6px;
            height: 6px;
            border-radius: var(--r-full);
            background: var(--surface-5);
            transition: background var(--dur-fast) var(--ease-out);
        }

        .attempt-pip.used {
            background: var(--loss);
        }

        .lockout-timer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 16px;
            background: var(--loss-subtle);
            border: 1px solid rgba(255, 69, 58, 0.2);
            border-radius: var(--r-md);
            font-size: var(--text-sm);
            color: var(--loss);
        }

        .lockout-timer svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .lockout-countdown {
            font-family: var(--font-mono);
            font-weight: var(--weight-bold);
            margin-left: auto;
        }

        .totp-sent-hint {
            font-size: var(--text-xs);
            color: var(--profit);
            text-align: center;
            margin-top: 4px;
        }

        .field-error {
            font-size: var(--text-xs);
            color: var(--loss);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .mode-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            letter-spacing: var(--tracking-wide);
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .mode-pill.paper {
            background: var(--brand-dim);
            border: 1px solid var(--border-brand);
            color: var(--brand);
        }

        .mode-pill.live {
            background: var(--loss-dim);
            border: 1px solid rgba(255, 69, 58, 0.2);
            color: var(--loss);
        }

        .mode-dot {
            width: 5px;
            height: 5px;
            border-radius: var(--r-full);
        }

        .mode-pill.paper .mode-dot { background: var(--brand); }
        .mode-pill.live  .mode-dot { background: var(--loss);  animation: pulse-dot 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="login-root" id="app">
        <div class="login-brand">
            <svg class="login-brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="8" fill="#0a0a0f"/>
                <polygon points="18,3 8,18 15,18 14,29 24,14 17,14"
                    fill="#00d4aa" stroke="#00d4aa" stroke-width="0.5"
                    stroke-linejoin="round"/>
            </svg>
            <div>
                <div class="login-brand-name">Signal Engine</div>
                <div class="login-brand-sub">v5.0.0 · Automated Crypto Futures</div>
            </div>
        </div>

        <div class="login-card">
            <div id="mode-pill-wrap"></div>
            <div class="login-card-title">Welcome back</div>
            <div class="login-card-sub">Sign in to your dashboard</div>

            <div id="lockout-banner" style="display:none;" class="lockout-timer">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span id="lockout-text">Account temporarily locked</span>
                <span class="lockout-countdown" id="lockout-countdown"></span>
            </div>

            <div id="error-banner" style="display:none;" class="alert alert-error">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <div class="alert-content">
                    <div class="alert-desc" id="error-text"></div>
                </div>
            </div>

            <form class="login-form" id="login-form" autocomplete="on">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input
                        id="username"
                        class="input"
                        type="text"
                        name="username"
                        placeholder="admin"
                        autocomplete="username"
                        required
                    />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        id="password"
                        class="input"
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    />
                </div>

                <div class="form-group">
                    <label class="form-label" for="totp">Authenticator Code</label>
                    <div class="login-totp-row">
                        <input
                            id="totp"
                            class="input"
                            type="text"
                            inputmode="numeric"
                            maxlength="6"
                            placeholder="000000"
                            autocomplete="one-time-code"
                            required
                        />
                        <button type="button" class="btn btn-secondary btn-sm"
                            id="telegram-btn"
                            style="white-space:nowrap;flex-shrink:0;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            Telegram
                        </button>
                    </div>
                    <div id="totp-sent-hint" class="totp-sent-hint" style="display:none;">
                        Code sent — check Telegram · valid 30 seconds
                    </div>
                </div>

                <div id="attempt-indicator" style="display:none;" class="attempt-indicator">
                    <span style="font-size:var(--text-xs);color:var(--text-4);">Attempts:</span>
                    <div class="attempt-pip" id="pip-1"></div>
                    <div class="attempt-pip" id="pip-2"></div>
                    <div class="attempt-pip" id="pip-3"></div>
                    <div class="attempt-pip" id="pip-4"></div>
                    <div class="attempt-pip" id="pip-5"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-full login-submit btn-lg"
                    id="submit-btn">
                    Sign In
                </button>
            </form>
        </div>

        <div class="login-footer">
            First time? <a href="/auth/setup">Setup your account</a>
            &nbsp;·&nbsp;
            <a href="#" id="forgot-link">Forgot password?</a>
        </div>
    </div>

    <script>
        const MODE = '{{ mode }}'

        const modePillWrap = document.getElementById('mode-pill-wrap')
        modePillWrap.innerHTML = `
            <div class="mode-pill ${MODE}">
                <div class="mode-dot"></div>
                ${MODE === 'live' ? 'Live Trading' : 'Paper Trading'}
            </div>
        `

        const form         = document.getElementById('login-form')
        const submitBtn    = document.getElementById('submit-btn')
        const errorBanner  = document.getElementById('error-banner')
        const errorText    = document.getElementById('error-text')
        const lockoutBanner= document.getElementById('lockout-banner')
        const lockoutText  = document.getElementById('lockout-text')
        const lockoutCount = document.getElementById('lockout-countdown')
        const telegramBtn  = document.getElementById('telegram-btn')
        const totpSentHint = document.getElementById('totp-sent-hint')
        const attemptInd   = document.getElementById('attempt-indicator')
        const totpInput    = document.getElementById('totp')
        const forgotLink   = document.getElementById('forgot-link')

        let lockoutTimer   = null
        let lockoutSeconds = 0
        let attemptsUsed   = 0

        totpInput.addEventListener('input', e => {
            e.target.value = e.target.value.replace(/\D/g, '')
        })

        function showError(msg) {
            errorText.textContent = msg
            errorBanner.style.display = 'flex'
            lockoutBanner.style.display = 'none'
        }

        function hideError() {
            errorBanner.style.display = 'none'
        }

        function showLockout(minutes) {
            lockoutSeconds = minutes * 60
            lockoutBanner.style.display = 'flex'
            errorBanner.style.display   = 'none'
            submitBtn.disabled          = true
            form.querySelectorAll('input').forEach(i => i.disabled = true)

            function tick() {
                if (lockoutSeconds <= 0) {
                    clearInterval(lockoutTimer)
                    lockoutBanner.style.display = 'none'
                    submitBtn.disabled          = false
                    form.querySelectorAll('input').forEach(i => i.disabled = false)
                    attemptsUsed = 0
                    updatePips(0)
                    return
                }
                const m = Math.floor(lockoutSeconds / 60)
                const s = lockoutSeconds % 60
                lockoutCount.textContent = m + ':' + String(s).padStart(2, '0')
                lockoutSeconds--
            }

            tick()
            lockoutTimer = setInterval(tick, 1000)
        }

        function updatePips(used) {
            attemptsUsed = used
            if (used > 0) {
                attemptInd.style.display = 'flex'
                for (let i = 1; i <= 5; i++) {
                    const pip = document.getElementById('pip-' + i)
                    pip.classList.toggle('used', i <= used)
                }
            } else {
                attemptInd.style.display = 'none'
            }
        }

        function setLoading(loading) {
            submitBtn.disabled = loading
            submitBtn.innerHTML = loading
                ? '<span class="spinner spinner-xs spinner-white"></span> Signing in...'
                : 'Sign In'
        }

        form.addEventListener('submit', async e => {
            e.preventDefault()
            hideError()

            const username  = document.getElementById('username').value.trim()
            const password  = document.getElementById('password').value
            const totp_code = totpInput.value.trim()

            if (!username || !password || totp_code.length < 6) {
                showError('Please fill in all fields including the 6-digit authenticator code.')
                return
            }

            setLoading(true)

            try {
                const res  = await fetch('/auth/login', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify({ username, password, totp_code })
                })
                const data = await res.json()

                if (data.success) {
                    submitBtn.innerHTML = '<span class="spinner spinner-xs spinner-white"></span> Redirecting...'
                    window.location.href = '/app.html'
                } else if (data.locked) {
                    showLockout(data.lockout_minutes || 15)
                } else {
                    showError(data.reason || 'Invalid credentials')
                    const remaining = data.attempts_remaining ?? (5 - attemptsUsed - 1)
                    updatePips(5 - remaining)
                    setLoading(false)
                }
            } catch(err) {
                showError('Network error — please try again.')
                setLoading(false)
            }
        })

        telegramBtn.addEventListener('click', async () => {
            telegramBtn.disabled = true
            telegramBtn.innerHTML = '<span class="spinner spinner-xs"></span>'
            try {
                const res  = await fetch('/auth/request-totp', { method: 'POST' })
                const data = await res.json()
                if (data.success) {
                    totpSentHint.style.display = 'block'
                    setTimeout(() => {
                        totpSentHint.style.display = 'none'
                        telegramBtn.disabled       = false
                        telegramBtn.innerHTML      = '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Telegram'
                    }, 35000)
                } else {
                    telegramBtn.disabled = false
                    telegramBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Telegram'
                }
            } catch(err) {
                telegramBtn.disabled = false
                telegramBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Telegram'
            }
        })

        forgotLink.addEventListener('click', e => {
            e.preventDefault()
            window.location.href = '/auth/setup'
        })

        const savedTheme = localStorage.getItem('se_theme') || 'dark'
        document.documentElement.setAttribute('data-theme', savedTheme)
    </script>
</body>
</html>
