<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Engine v5 — Login</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/app.css">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
        }

        .login-wrap {
            width: 100%;
            max-width: 380px;
            padding: 16px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
        }

        .login-logo-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .login-logo-sub {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 4px;
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-border);
            border-radius: var(--radius-lg);
            padding: 28px;
        }

        .login-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .login-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }

        .totp-row {
            display: flex;
            gap: 8px;
        }

        .totp-row .input {
            flex: 1;
            font-family: var(--font-mono);
            font-size: 16px;
            letter-spacing: 4px;
            text-align: center;
        }

        .login-btn {
            width: 100%;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 8px;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--blue);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-wrap" x-data="loginApp()">
        <div class="login-logo">
            <svg class="login-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
                <rect width="32" height="32" rx="8" fill="#111118"/>
                <polygon points="18,3 8,18 15,18 14,29 24,14 17,14" fill="#00d4aa" stroke="#00d4aa" stroke-width="0.5" stroke-linejoin="round"/>
            </svg>
            <div class="login-logo-title">Signal Engine</div>
            <div class="login-logo-sub">v5.0.0 — Automated Crypto Futures</div>
        </div>

        <div class="login-card">
            <div class="login-title">Welcome back</div>
            <div class="login-sub">Sign in to your dashboard</div>

            <div x-show="error" x-cloak class="alert alert-error" x-text="error"></div>

            <form @submit.prevent="login">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input
                        id="username"
                        class="input"
                        type="text"
                        x-model="form.username"
                        placeholder="admin"
                        autocomplete="username"
                        :disabled="loading"
                        aria-label="Username"
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        id="password"
                        class="input"
                        type="password"
                        x-model="form.password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        :disabled="loading"
                        aria-label="Password"
                        aria-required="true"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="totp">TOTP Code</label>
                    <div class="totp-row">
                        <input
                            id="totp"
                            class="input"
                            type="text"
                            inputmode="numeric"
                            maxlength="6"
                            x-model="form.totp_code"
                            placeholder="000000"
                            autocomplete="one-time-code"
                            :disabled="loading"
                            aria-label="TOTP Code"
                            aria-required="true"
                            @input="form.totp_code = form.totp_code.replace(/\D/g,'')"
                        >
                        <button
                            type="button"
                            class="btn btn-ghost"
                            @click="requestTotp"
                            :disabled="loading || totpSent"
                            aria-label="Send TOTP code via Telegram"
                            title="Send TOTP via Telegram"
                        >
                            <span x-text="totpSent ? 'Sent' : 'Telegram'"></span>
                        </button>
                    </div>
                    <div
                        x-show="totpSent"
                        x-cloak
                        role="status"
                        aria-live="polite"
                        style="font-size:11px;color:var(--green);margin-top:4px;"
                    >
                        Code sent to Telegram — valid 30 seconds
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary login-btn"
                    :disabled="loading || !form.username || !form.password || form.totp_code.length < 6"
                    aria-label="Sign in"
                    :aria-busy="loading"
                >
                    <span x-show="loading" class="spinner" aria-hidden="true"></span>
                    <span x-text="loading ? 'Signing in...' : 'Sign In'"></span>
                </button>
            </form>
        </div>

        <div class="login-footer">
            First time? <a href="/auth/setup">Setup your account</a>
        </div>
    </div>

    <script>
        function loginApp() {
            return {
                form: {
                    username:  '',
                    password:  '',
                    totp_code: ''
                },
                loading:  false,
                error:    '',
                totpSent: false,

                async login() {
                    this.error   = ''
                    this.loading = true
                    try {
                        const res  = await fetch('/auth/login', {
                            method:  'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body:    JSON.stringify(this.form)
                        })
                        const data = await res.json()
                        if (data.success) {
                            window.location.href = '/app.html'
                        } else {
                            this.error = data.reason || 'Login failed'
                        }
                    } catch (e) {
                        this.error = 'Network error — try again'
                    } finally {
                        this.loading = false
                    }
                },

                async requestTotp() {
                    try {
                        const res  = await fetch('/auth/request-totp', { method: 'POST' })
                        const data = await res.json()
                        if (data.success) {
                            this.totpSent = true
                            setTimeout(() => { this.totpSent = false }, 35000)
                        }
                    } catch (e) {}
                }
            }
        }
    </script>
</body>
</html>
