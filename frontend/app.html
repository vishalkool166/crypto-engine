<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Engine v5</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <style>
        @keyframes ticker-scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "preact":       "/js/preact.min.js",
            "preact/hooks": "/js/preact-hooks.min.js"
        }
    }
    </script>
    <script type="module">
        import { h, render, Fragment, Component } from 'preact'
        import { useState, useEffect, useRef, useCallback } from 'preact/hooks'
        import htm from '/js/htm.min.js'

        window.preact      = { h, render, Fragment, Component }
        window.preactHooks = { useState, useEffect, useRef, useCallback }
        window.html        = htm.bind(h)

        const scripts = [
            '/js/utils.js',
            '/js/charts.js',
            '/js/api.js',
            '/js/store.js',
            '/js/components.js',
            '/js/pages/overview.js',
            '/js/pages/freqtrade.js',
            '/js/pages/signals.js',
            '/js/pages/coins.js',
            '/js/pages/backtest.js',
            '/js/pages/analysis.js',
            '/js/pages/audit.js',
            '/js/pages/settings.js',
            '/js/app.js',
        ]

        for (const src of scripts) {
            await new Promise((resolve, reject) => {
                const s    = document.createElement('script')
                s.src      = src
                s.onload   = resolve
                s.onerror  = reject
                document.body.appendChild(s)
            })
        }
    </script>
    <script src="/js/chartjs.min.js"></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
