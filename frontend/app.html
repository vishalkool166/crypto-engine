<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="color-scheme" content="dark light">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Signal Engine">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Signal Engine">
    <title>Signal Engine v5</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/typography.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/badges.css">
    <link rel="stylesheet" href="/css/components/cards.css">
    <link rel="stylesheet" href="/css/components/tables.css">
    <link rel="stylesheet" href="/css/components/forms.css">
    <link rel="stylesheet" href="/css/components/modals.css">
    <link rel="stylesheet" href="/css/components/charts.css">
    <link rel="stylesheet" href="/css/components/feedback.css">
    <link rel="stylesheet" href="/css/components/progress.css">

    <script>
        (function() {
            const saved = localStorage.getItem('se_theme')
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            const theme = saved || (systemDark ? 'dark' : 'light')
            document.documentElement.setAttribute('data-theme', theme)

            function applyThemeColor(t) {
                const color = t === 'light' ? '#F2F2F7' : '#000000'
                document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.remove())
                const meta = document.createElement('meta')
                meta.name = 'theme-color'
                meta.content = color
                document.head.appendChild(meta)
            }

            if (saved) {
                applyThemeColor(saved)
            }

            window.__applyThemeColor = applyThemeColor
        })()
    </script>

    <script type="importmap">
    {
        "imports": {
            "preact":       "/js/preact.min.js",
            "preact/hooks": "/js/preact-hooks.min.js"
        }
    }
    </script>
    <script src="/js/chartjs.min.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW failed:', err))
            })
        }
    </script>
</head>
<body>
    <a href="#main-content" class="skip-nav">Skip to main content</a>
    <div id="root"></div>

    <script type="module">
        async function checkAuth() {
            try {
                const res = await fetch('/api/health', { credentials: 'include' })
                if (res.status === 401) {
                    window.location.replace('/login.html')
                    return false
                }
                return true
            } catch(e) {
                return true
            }
        }

        const authed = await checkAuth()
        if (!authed) throw new Error('unauthenticated')

        import { h, render, Fragment, Component } from 'preact'
        import { useState, useEffect, useRef, useCallback } from 'preact/hooks'
        import htm from '/js/htm.min.js'

        window.preact      = { h, render, Fragment, Component }
        window.preactHooks = { useState, useEffect, useRef, useCallback }
        window.html        = htm.bind(h)

        const scripts = [
            '/js/utils.js',
            '/js/charts.js',
            '/js/api.js',
            '/js/store.js',
            '/js/components.js',
            '/js/pages/now.js',
            '/js/pages/positions.js',
            '/js/pages/performance.js',
            '/js/pages/universe.js',
            '/js/pages/system.js',
            '/js/app.js',
        ]

        for (const src of scripts) {
            await new Promise((resolve, reject) => {
                const s   = document.createElement('script')
                s.src     = src
                s.onload  = resolve
                s.onerror = reject
                document.body.appendChild(s)
            })
        }

        Store.on('theme', theme => {
            if (window.__applyThemeColor) {
                window.__applyThemeColor(theme)
            }
        })

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            const saved = localStorage.getItem('se_theme')
            if (!saved && window.__applyThemeColor) {
                window.__applyThemeColor(e.matches ? 'dark' : 'light')
            }
        })
    </script>
</body>
</html>
