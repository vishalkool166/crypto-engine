events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # signal.vishalkool.top — Signal Engine dashboard
    server {
        listen 80;
        server_name signal.vishalkool.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name signal.vishalkool.top;

        ssl_certificate     /etc/nginx/certs/signal.vishalkool.top.crt;
        ssl_certificate_key /etc/nginx/certs/signal.vishalkool.top.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # WebSocket support for /ws/ paths
        location /ws/ {
            proxy_pass         http://signal-engine:8000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # All other traffic
        location / {
            proxy_pass         http://signal-engine:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
        }
    }

    # trade.vishalkool.top — Freqtrade FreqUI
    server {
        listen 80;
        server_name trade.vishalkool.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name trade.vishalkool.top;

        ssl_certificate     /etc/nginx/certs/trade.vishalkool.top.crt;
        ssl_certificate_key /etc/nginx/certs/trade.vishalkool.top.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass         http://freqtrade:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
        }
    }
}