services:

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  signal-engine:
    build: .
    container_name: signal-engine
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: freqtrade
    ports:
      - "8080:8080"
    volumes:
      - ./freqtrade/user_data:/freqtrade/user_data
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      signal-engine:
        condition: service_healthy
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy SignalEngineStrategy
    restart: unless-stopped

volumes:
  redis_data:

freqtrade:
    environment:
      - REDIS_URL=redis://redis:6379
      - FREQTRADE__EXCHANGE__KEY=${BINANCE_API_KEY}
      - FREQTRADE__EXCHANGE__SECRET=${BINANCE_SECRET}