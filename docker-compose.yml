services:
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt: ["no-new-privileges:true"]

  signal-engine:
    build: .
    container_name: signal-engine
    stop_grace_period: 45s
    expose: ["8000"]
    volumes:
      - ./database:/app/database
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MODE_SWITCH_RESTART: "true"
      HF_HOME: /app/database/model-cache
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.2}
    container_name: signal-engine-tunnel
    command: ["tunnel", "--no-autoupdate", "--protocol", "${TUNNEL_PROTOCOL:-http2}", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the server .env}
    restart: always
    stop_grace_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  redis_data: