# Optional Cloudflare connector. Supply TUNNEL_TOKEN in the server .env.
# Usage: docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml up -d --build
services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.2}
    container_name: signal-engine-tunnel
    command: ["tunnel", "--no-autoupdate", "--protocol", "${TUNNEL_PROTOCOL:-http2}", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in the server .env before starting Cloudflare Tunnel}
    restart: always
    stop_grace_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
