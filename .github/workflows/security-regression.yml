name: Backend verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      # Offline tests exercise stable library boundaries and mock broker calls.
      # Full-stack builds and authenticated testnet validation are separate gates.
      - name: Install isolated test dependencies
        run: python -m pip install pytest pytest-asyncio fastapi httpx python-dotenv pandas==2.2.2 pyotp SQLAlchemy requests
      - name: Python compilation
        run: python -m compileall -q -x 'frontend/' .
      - name: Safety and research regression suite
        run: python -m pytest -q tests
